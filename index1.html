<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Review Tool</title>
  <style>
    :root {
      --color-bg: #f5f6fa;
      --color-surface: #ffffff;
      --color-border: #e0e2e8;
      --color-text: #1f2430;
      --color-text-muted: #6b7280;
      --color-primary: #3b5bfd;
      --color-primary-hover: #2f49d6;
      --color-user-bubble: #3b5bfd;
      --color-assistant-bubble: #eef0f6;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      padding: 16px 24px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .app-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .app-main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    .panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .drop-zone {
      flex: 1;
      margin: 18px;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .drop-zone.dragover {
      border-color: var(--color-primary);
      background: #eef1ff;
    }

    .drop-zone-content {
      text-align: center;
    }

    .drop-zone-title {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 500;
    }

    .drop-zone-subtitle {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .pdf-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid var(--color-border);
    }

    .file-name {
      font-size: 13px;
      color: var(--color-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pdf-embed {
      flex: 1;
      width: 100%;
      border: none;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-message {
      display: flex;
    }

    .chat-message.user {
      justify-content: flex-end;
    }

    .chat-message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .chat-message.user .bubble {
      background: var(--color-user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-message.assistant .bubble {
      background: var(--color-assistant-bubble);
      color: var(--color-text);
      border-bottom-left-radius: 4px;
    }

    .chat-message.error .bubble {
      background: #fdf2f2 !important;
      color: #de3535 !important;
      border: 1px solid #f8b4b4;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--color-border);
    }

    .chat-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .chat-input-row input:focus {
      border-color: var(--color-primary);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: var(--color-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--color-primary-hover);
    }

    .btn-secondary {
      background: var(--color-surface);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: var(--color-bg);
    }

    @keyframes pulseText {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .thinking-bubble {
      animation: pulseText 1.5s infinite ease-in-out;
    }

    @media (max-width: 800px) {
      .app-main {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Contract Review</h1>
  </header>

  <main class="app-main">
    <section class="panel contract-panel">
      <div class="panel-header">
        <h2>Contract</h2>
      </div>

      <div id="dropZone" class="drop-zone">
        <input type="file" id="fileInput" accept="application/pdf" hidden />
        <div class="drop-zone-content">
          <p class="drop-zone-title">Drag &amp; drop a PDF here</p>
          <p class="drop-zone-subtitle">or</p>
          <button id="browseBtn" type="button" class="btn">Browse Files</button>
        </div>
      </div>

      <div id="pdfViewer" class="pdf-viewer" hidden>
        <div class="pdf-toolbar">
          <span id="fileName" class="file-name"></span>
          <button id="clearBtn" type="button" class="btn btn-secondary">Remove</button>
        </div>
        <embed id="pdfEmbed" class="pdf-embed" type="application/pdf" />
      </div>
    </section>

    <section class="panel chat-panel">
      <div class="panel-header">
        <h2>Chat</h2>
      </div>

      <div id="chatMessages" class="chat-messages">
        <div class="chat-message assistant">
          <div class="bubble">Upload a contract and ask me anything about it.</div>
        </div>
      </div>

      <form id="chatForm" class="chat-input-row">
        <input
          id="chatInput"
          type="text"
          placeholder="Type a question about the contract..."
          autocomplete="off"
        />
        <button type="button" id="sendBtn" class="btn">Send</button>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const browseBtn = document.getElementById("browseBtn");
      const pdfViewer = document.getElementById("pdfViewer");
      const pdfEmbed = document.getElementById("pdfEmbed");
      const fileName = document.getElementById("fileName");
      const clearBtn = document.getElementById("clearBtn");

      const chatInput = document.getElementById("chatInput");
      const chatMessages = document.getElementById("chatMessages");
      const sendBtn = document.getElementById("sendBtn");

      // Production webhook URL for this workflow. Requires the workflow's
      // "Active" toggle to be on in the n8n editor. While testing, you can
      // swap this for the /webhook-test/ URL, but that one only answers a
      // single request after clicking "Execute workflow" on the canvas.
      const N8N_WEBHOOK_URL = "https://jyotiv99.app.n8n.cloud/webhook/691fc3ff-53e1-465b-8b17-363c9a5cce45";
      let currentObjectUrl = null;
      let selectedFile = null;

      function loadPdf(file) {
        if (!file || file.type !== "application/pdf") {
          alert("Please upload a PDF file.");
          return;
        }

        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }

        selectedFile = file;
        currentObjectUrl = URL.createObjectURL(file);
        pdfEmbed.setAttribute("src", currentObjectUrl);
        fileName.textContent = file.name;

        dropZone.hidden = true;
        pdfViewer.hidden = false;
      }

      function clearPdf() {
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = null;
        }
        selectedFile = null;
        pdfEmbed.removeAttribute("src");
        fileInput.value = "";
        pdfViewer.hidden = true;
        dropZone.hidden = false;
      }

      // Open file browser when clicking the button or the zone text
      browseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        fileInput.click();
      });
      
      dropZone.addEventListener("click", () => {
        fileInput.click();
      });

      // FIXED: Correctly extracts the specific single file item [0]
      fileInput.addEventListener("change", () => {
        if (fileInput.files && fileInput.files[0]) {
          loadPdf(fileInput.files[0]);
        }
      });

      clearBtn.addEventListener("click", clearPdf);

      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add("dragover");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove("dragover");
        });
      });

      dropZone.addEventListener("drop", (e) => {
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) {
          loadPdf(file);
        }
      });

      function addMessage(text, role, isThinking = false) {
        const messageEl = document.createElement("div");
        messageEl.className = `chat-message ${role}`;

        const bubble = document.createElement("div");
        bubble.className = isThinking ? "bubble thinking-bubble" : "bubble";
        bubble.textContent = text;

        messageEl.appendChild(bubble);
        chatMessages.appendChild(messageEl);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageEl;
      }

      function extractReplyText(data) {
        if (typeof data === "string") return data;
        if (Array.isArray(data)) return extractReplyText(data[0]);
        if (data && typeof data === "object") {
          return (
            data.reply ||
            data.response ||
            data.message ||
            data.output ||
            data.text ||
            JSON.stringify(data)
          );
        }
        return "Received an empty response from the workflow.";
      }

      async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        chatInput.value = "";

        const thinkingEl = addMessage("Thinking...", "assistant", true);

        try {
          // Sent as multipart/form-data (not JSON) so the actual PDF bytes
          // reach the workflow under the "data" field, matching the Webhook
          // node's "Field Name for Binary Data" setting. Do not set a
          // Content-Type header here: fetch generates the multipart
          // boundary itself when the body is a FormData instance.
          const formData = new FormData();
          formData.append("message", text);
          if (selectedFile) {
            formData.append("data", selectedFile, selectedFile.name);
          }

          const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(`Workflow returned ${response.status} ${response.statusText}`);
          }

          const contentType = response.headers.get("content-type") || "";
          const data = contentType.includes("application/json")
            ? await response.json()
            : await response.text();

          thinkingEl.remove();
          addMessage(extractReplyText(data), "assistant");
        } catch (err) {
          thinkingEl.remove();
          addMessage(`Could not reach the workflow: ${err.message}`, "error");
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });
    })();
  </script>
</body>
</html>
